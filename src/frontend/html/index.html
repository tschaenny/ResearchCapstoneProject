<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Botswana National Museum · Website Prototype</title>
<meta name="description" content="Clickable prototype: museum website with ticketing (time slots), collection database, QR codes and staff area.">

<!-- The headings depend on Archivo's width axis, and the font used to be
     inlined as base64. Preload it so splitting the file out does not
     introduce a flash of unstyled text that was never there before. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/archivo-variable.woff2">

<!-- Stylesheets are listed individually rather than pulled in through a
     main.css of @imports: @import is a serialization point (the browser
     cannot discover tokens.css until main.css has arrived and parsed),
     whereas <link> elements are found by the preload scanner and fetch in
     parallel. base/ must come first — everything depends on the tokens. -->
<link rel="stylesheet" href="/css/base/fonts.css">
<link rel="stylesheet" href="/css/base/tokens.css">
<link rel="stylesheet" href="/css/base/reset.css">
<link rel="stylesheet" href="/css/base/typography.css">

<link rel="stylesheet" href="/css/components/buttons.css">
<link rel="stylesheet" href="/css/components/protobar.css">
<link rel="stylesheet" href="/css/layout/header.css">
<link rel="stylesheet" href="/css/components/forms.css">
<link rel="stylesheet" href="/css/layout/sections.css">

<link rel="stylesheet" href="/css/pages/home.css">
<link rel="stylesheet" href="/css/components/cards.css">
<link rel="stylesheet" href="/css/components/eventrow.css">
<link rel="stylesheet" href="/css/layout/footer.css">
<link rel="stylesheet" href="/css/layout/pagehead.css">

<link rel="stylesheet" href="/css/pages/tickets.css">
<link rel="stylesheet" href="/css/pages/collection.css">
